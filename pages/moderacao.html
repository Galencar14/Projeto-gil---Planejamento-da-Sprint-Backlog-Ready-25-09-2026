<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Livros — LetterBook</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">📖 LetterBook</a>
      <nav class="nav-links" id="navLinks">
        <a href="leitura.html">Leitura Atual</a>
        <a href="comunidades.html">Comunidades</a>
        <a href="ranking.html">Ranking</a>
        <a href="concluidos.html">Concluídos</a>
        <a href="sugestoes.html">Sugestões</a>
        <a href="historico.html">Histórico</a>
        <a href="lojas.html">Lojas</a>
        <a href="perfil.html">Perfil</a>
      </nav>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </header>

  <!-- PBI-06: Revisar informações cadastradas (moderador) -->
  <section class="section container">
    <div class="section-title">
      <h2>Gerenciamento de Livros</h2>
      <span class="tag">Área do moderador</span>
    </div>
    <p style="margin-top: -10px; margin-bottom: 18px;">Revise os livros enviados pelos usuários antes de confirmá-los na plataforma.</p>

    <!-- A lista é montada pelo js/moderacao.js -->
    <div id="bookList"></div>

    <!-- Painel de revisão: aparece ao clicar em "Revisar" -->
    <div class="form-box review-panel" id="reviewPanel" hidden>
      <div class="section-title" style="margin-bottom: 10px;">
        <h3 id="reviewTitle">Revisão</h3>
        <button class="btn btn-outline btn-small" id="closeReviewBtn">Fechar</button>
      </div>
      <table class="review-table">
        <tbody id="reviewFields"></tbody>
      </table>
      <div class="field-row">
        <button class="btn" id="confirmBookBtn" hidden>Confirmar livro na plataforma</button>
      </div>
      <p class="msg-feedback" id="reviewFeedback"></p>
    </div>

    <div class="field-row" style="margin-top: 22px;">
      <button class="btn btn-outline btn-small" id="resetModeracaoBtn">Reiniciar demonstração</button>
    </div>
  </section>

  <footer>
    <p>LetterBook — projeto acadêmico em desenvolvimento</p>
  </footer>

  <script src="../js/script.js"></script>
  <script src="../js/moderacao.js"></script>
</body>
</html>
